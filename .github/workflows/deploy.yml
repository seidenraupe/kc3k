name: Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages bleibt die Vorschau.
# Derselbe Build wird per SSH nach Kreativmedia gelegt, sobald die Secrets stehen.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-kc3k
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Deploy-Stamp ins Build
        run: |
          {
            echo "commit=${{ github.sha }}"
            echo "run_id=${{ github.run_id }}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> dist/deploy-stamp.txt
          test "$(find dist/documents/news -name '*.pdf' | wc -l)" -ge 9
      - name: ZIP für manuelles Plesk-Deploy
        run: |
          (cd dist && zip -r ../kc3k-dist.zip .)
          ls -lh kc3k-dist.zip
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: kc3k-dist-zip
          path: kc3k-dist.zip

  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  kreativmedia:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Deploy-Stamp (Prüfung auf dem Server)
        run: |
          {
            echo "commit=${{ github.sha }}"
            echo "run_id=${{ github.run_id }}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > dist/deploy-stamp.txt
          test "$(find dist/documents/news -name '*.pdf' 2>/dev/null | wc -l)" -ge 9

      - name: Secrets prüfen
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_TARGET_DIR: ${{ secrets.SSH_TARGET_DIR }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          missing=0
          for name in SSH_HOST SSH_USER SSH_TARGET_DIR SSH_PRIVATE_KEY; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "::error title=Secret fehlt::$name ist im Repository nicht gesetzt."
              missing=1
            fi
          done
          exit "$missing"

      - name: Nach Kreativmedia deployen
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_TARGET_DIR: ${{ secrets.SSH_TARGET_DIR }}
        run: |
          set -euo pipefail
          port=2121
          target="${SSH_TARGET_DIR%/}"
          echo "Ziel: ${SSH_USER}@${SSH_HOST}:${port} -> ${target}"
          if [ "$target" != "/kc3k.ch" ]; then
            echo "::error title=Falscher Zielordner::SSH_TARGET_DIR muss /kc3k.ch sein (Plesk-Chroot). Aktuell: ${SSH_TARGET_DIR}"
            exit 1
          fi
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/kc3k_deploy"
          chmod 600 "$HOME/.ssh/kc3k_deploy"
          if ! fingerprint=$(ssh-keygen -lf "$HOME/.ssh/kc3k_deploy" 2>&1); then
            echo "::error title=Schlüssel ungültig::SSH_PRIVATE_KEY ist kein OpenSSH-Privatschlüssel. Erwartet wird kc3k-deploy, Fingerabdruck SHA256:xhyVWVuLaCxWSfEEVOEt05P9npzIOVneOw8JshCzf08"
            echo "$fingerprint"
            exit 1
          fi
          echo "Schlüssel: $fingerprint"
          ssh -i "$HOME/.ssh/kc3k_deploy" -p "$port" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 \
            "${SSH_USER}@${SSH_HOST}" "test -d '$target' && echo ssh-ok"
          rsync -rlgoDzvc -i --delete \
            --exclude 'kc3k-kreativmedia.zip' \
            --exclude 'upload/config.php' \
            -e "ssh -i $HOME/.ssh/kc3k_deploy -p $port -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new" \
            dist/ "${SSH_USER}@${SSH_HOST}:${target}/"
          rsync -rlgoDzvc --ignore-existing \
            -e "ssh -i $HOME/.ssh/kc3k_deploy -p $port -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new" \
            dist/upload/config.php "${SSH_USER}@${SSH_HOST}:${target}/upload/config.php"
          expected_news=$(grep -oE 'assets/news-[^"]+\.js' dist/news.html | head -1)
          echo "Erwartetes news-Bundle im Build: ${expected_news}"
          ssh -i "$HOME/.ssh/kc3k_deploy" -p "$port" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "${SSH_USER}@${SSH_HOST}" \
            "set -e; test -f '${target}/deploy-stamp.txt'; test -f '${target}/version.txt'; pdfs=\$(find '${target}/documents/news' -name '*.pdf' 2>/dev/null | wc -l); test \"\$pdfs\" -ge 9; echo \"PDFs auf Server: \$pdfs\"; cat '${target}/deploy-stamp.txt'; on_server=\$(grep -oE 'assets/news-[^\"]+\\.js' '${target}/news.html' | head -1); echo \"news.html auf Server: \$on_server\"; test \"\$on_server\" = '${expected_news}'"

      - name: Live-Check News und PDFs
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          expected="${GITHUB_SHA:0:7}"
          deployed=$(curl -fsSL "https://kc3k.ch/version.txt" | tr -d '\n\r')
          echo "Live version.txt: ${deployed:-<leer>}, erwartet: $expected"
          if [ "$deployed" != "$expected" ]; then
            echo "::error title=Veralteter Live-Stand::kc3k.ch zeigt Commit $deployed, gebaut wurde $expected. Ist GitHub main auf dem neuesten Stand?"
            exit 1
          fi
          json=$(curl -fsSL "https://kc3k.ch/data/news.json")
          echo "$json" | grep -q '"3K-News Nr. 93"'
          echo "$json" | grep -q './documents/news/3k-news-nr-92-2026-04-29.pdf'
          ! echo "$json" | grep -q 'drive.google.com'
          curl -fsSI "https://kc3k.ch/documents/news/3k-news-nr-93-2026-09-29.pdf" | grep -qi '^HTTP/.* 200'
          curl -fsSI "https://kc3k.ch/documents/news/3k-news-nr-92-2026-04-29.pdf" | grep -qi '^HTTP/.* 200'
